<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 215" width="100%" height="100%">
<style>
  text { font-family: "Atkinson Hyperlegible Next", "Helvetica Neue", Arial, sans-serif; fill: #18243a; }
  .mono { font-family: "Atkinson Hyperlegible Mono", "SFMono-Regular", Consolas, monospace; }
  .title { font-size: 13px; font-weight: 800; fill: #25324d; }
  .sub { font-size: 10px; fill: #4f5b70; }
  .lbl { font-size: 10px; font-weight: 600; fill: #18243a; }
  .ax { font-size: 9.4px; fill: #4f5b70; }
  .badge { font-size: 12px; font-weight: 800; fill: #ffffff; }
</style>
<rect x="0" y="0" width="900" height="215" rx="10" fill="#ffffff"/>
<rect x="12" y="10" width="22" height="22" rx="6" fill="#25324d"/>
<text x="23" y="25.5" text-anchor="middle" class="badge">A</text>
<text x="40" y="21.5" class="title">CBDAS (chr7:30.98 Mb) Across 216 Queries</text>
<text x="40" y="33.5" class="sub">79 intact (≥98.5%), 77 B-locus (93–98.5%), 60 pruned in synNet</text>
<text x="24" y="56" class="lbl">Intact CBDAS (≥98.5% id)</text>
<rect x="24" y="62" width="134.8" height="18" rx="4" fill="#009E73"/>
<text x="166.8" y="75" class="ax">79 (59 plants) — functional ortholog</text>
<text x="24" y="102" class="lbl">B-locus pseudogene (93.0–98.5%)</text>
<rect x="24" y="108" width="131.4" height="18" rx="4" fill="#E69F00"/>
<text x="163.4" y="121" class="ax">77 (67 plants) — all 63 drug-type</text>
<text x="24" y="148" class="lbl">Unaligned in synNet (pruned)</text>
<rect x="24" y="154" width="102.4" height="18" rx="4" fill="#D55E00"/>
<text x="134.4" y="167" class="ax">60 — 54 pruned by -syn (Finola 99.4%)</text>
<line x1="468" y1="12" x2="468" y2="203" stroke="#d5dbe5"/>
<rect x="480" y="10" width="22" height="22" rx="6" fill="#25324d"/>
<text x="491" y="25.5" text-anchor="middle" class="badge">B</text>
<text x="508" y="21.5" class="title">netFilter -syn Pruning vs Paralog Reuse</text>
<text x="508" y="33.5" class="sub">Removing -syn causes 46.4% (569/1,225) paralog interval reuse</text>
<text x="492" y="54" class="lbl">TPS tandem family (41 genes, 9 clusters)</text>
<rect x="492" y="59" width="13.6" height="14" rx="3" fill="#56B4E9"/>
<text x="513.6" y="70" class="ax mono">418/8,856 pruned (4.7%)</text>
<text x="492" y="92" class="lbl">BBE-like oxidocyclases (35 genes, 9 clusters)</text>
<rect x="492" y="97" width="31.0" height="14" rx="3" fill="#0072B2"/>
<text x="531.0" y="108" class="ax mono">807/7,560 pruned (10.7%)</text>
<text x="492" y="130" class="lbl">Pre-filter recovered pairs reusing paralog</text>
<rect x="492" y="135" width="134.6" height="14" rx="3" fill="#D55E00"/>
<text x="634.6" y="146" class="ax mono">569/1,225 reuse paralog (46.4%)</text>
<text x="492" y="168" class="lbl">Recovered pairs reusing ≥50% shared CDS</text>
<rect x="492" y="173" width="113.4" height="14" rx="3" fill="#E69F00"/>
<text x="613.4" y="184" class="ax mono">479/1,225 reuse ≥50% CDS (39.1%)</text>
</svg>